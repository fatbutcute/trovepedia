<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delve Index</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --yellow: #ffd700;
            --blue: #00e5ff;
            --bg: #0d0d15;
            --panel: #161624;
            --text: #ffffff;
            --dim: #8a8a9d;
        }

        body {
            background-color: #08080c;
            margin: 0;
            padding: 40px 20px;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        /* The Grid Wrapper */
        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        /* Smaller scaled card */
        .ui-card {
            background-color: var(--bg);
            border: 1px solid #2d2d3f;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s, border-color 0.2s;
        }

        .ui-card:hover {
            transform: translateY(-4px);
            border-color: var(--blue);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .depth-badge {
            color: var(--yellow);
            font-weight: 800;
            font-size: 0.65rem;
            text-transform: uppercase;
            border: 1px solid var(--yellow);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .difficulty-tag {
            color: var(--blue);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .title {
            color: var(--yellow);
            font-size: 1.2rem;
            margin: 0 0 12px 0;
            font-weight: 800;
        }

        .modifier-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mod-badge {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--dim);
            border: 1px solid #2d2d3f;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.03);
        }

        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row {
            background: var(--panel);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-box {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            color: var(--dim);
        }

        .main-text {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .objective {
            border-left: 3px solid var(--blue);
            background: linear-gradient(90deg, rgba(0,229,255,0.05) 0%, var(--panel) 100%);
        }

        .objective .main-text, .objective .icon-box {
            color: var(--blue);
        }

        .enemies { align-items: flex-start; }

        .label {
            color: var(--dim);
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .list-text {
            font-size: 0.85rem;
            line-height: 1.3;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="dashboard-container" id="dash">
    </div>

<script>
    // Just a quick script to generate 20 cards for preview
    const dash = document.getElementById('dash');
    const biomes = ["Neon Underground", "Castle Catastra", "Trovian Delve", "The Understacks"];
    
    for (let i = 0; i < 20; i++) {
        const biome = biomes[Math.floor(Math.random() * biomes.length)];
        dash.innerHTML += `
        <div class="ui-card">
            <div class="header">
                <div class="depth-badge">Depth ${112 + i}</div>
                <div class="difficulty-tag">Pure Midnight</div>
            </div>
            <h1 class="title">${biome}</h1>
            <div class="modifier-bar">
                <div class="mod-badge">Terror IV</div>
                <div class="mod-badge">Flame Spitters</div>
            </div>
            <div class="info-grid">
                <div class="row objective">
                    <div class="icon-box"><i class="ri-target-fill"></i></div>
                    <span class="main-text">Empty 5 Rooms</span>
                </div>
                <div class="row">
                    <div class="icon-box"><i class="ri-sword-fill"></i></div>
                    <span class="main-text">Weeping Prophet</span>
                </div>
                <div class="row enemies">
                    <div class="icon-box"><i class="ri-skull-2-fill"></i></div>
                    <div class="text-group">
                        <span class="label">Enemies</span>
                        <span class="list-text">Bladebot, Decompiler, Flying Cannonbot</span>
                    </div>
                </div>
            </div>
        </div>`;
    }
</script>

</body>
</html>
