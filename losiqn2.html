<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delve Timers</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #ffd700;
            --blue: #00e5ff;
            --bg-dark: #08080c;
            --card-bg: #11111b;
            --text-faint: #84849a;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        /* Standalone Timer Bar */
        .status-container {
            display: flex;
            gap: 40px;
            background: var(--card-bg);
            padding: 30px 60px;
            border-radius: 24px;
            border: 1px solid #252535;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }

        .timer-card { 
            flex: 1; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-header {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--text-faint);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .timer-header i {
            font-size: 1.1rem;
        }

        .time-val {
            font-family: 'Nunito', sans-serif;
            font-size: 2.4rem;
            margin-bottom: 15px;
            line-height: 1;
            font-variant-numeric: tabular-nums; /* Prevents text jumping */
        }

        .tz-display {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--yellow);
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-track { 
            width: 100%;
            height: 4px; 
            background: #222; 
            border-radius: 2px; 
            overflow: hidden;
            margin-top: auto;
        }
        
        .progress-fill { height: 100%; transition: width 0.5s ease; }

        /* Colors */
        .accent-blue .time-val, .accent-blue i { color: var(--blue); }
        .accent-blue .progress-fill { background: var(--blue); }
        
        .accent-yellow .time-val, .accent-yellow i { color: var(--yellow); }
        .accent-yellow .progress-fill { background: var(--yellow); }

        @media (max-width: 768px) {
            .status-container {
                flex-direction: column;
                gap: 50px;
                padding: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="status-container">
        <div class="timer-card">
            <div class="timer-header">
                <i class="ri-time-line"></i> CURRENT TIME
            </div>
            <div class="time-val" id="current-time">00:00:00</div>
            <div class="tz-display" id="user-tz">Detecting...</div>
        </div>

        <div class="timer-card accent-blue">
            <div class="timer-header">
                <i class="ri-sun-cloudy-line"></i> DAILY RESET
            </div>
            <div class="time-val">10:45:35</div>
            <div class="progress-track"><div class="progress-fill" style="width: 60%"></div></div>
        </div>

        <div class="timer-card accent-yellow">
            <div class="timer-header">
                <i class="ri-calendar-todo-line"></i> WEEKLY RESET
            </div>
            <div class="time-val">154:45:35</div>
            <div class="progress-track"><div class="progress-fill" style="width: 35%"></div></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Format time as HH:MM:SS
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${h}:${m}:${s}`;

            // Get Timezone Offset (e.g., GMT+1)
            const offset = -now.getTimezoneOffset() / 60;
            const sign = offset >= 0 ? "+" : "";
            const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            document.getElementById('user-tz').textContent = `Local Time (GMT${sign}${offset})`;
        }

        // Run once and then every second
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
